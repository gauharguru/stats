<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/site.js" defer></script>
</head>
<body>
<header id="site-header"></header>
<div class="page-title"><div class="wrap"><h1>Gallery</h1><p>Life at our campus</p></div></div>
<main><div class="wrap" data-tabs>
  <div class="tabs" role="tablist">
    <button data-tab="academics" role="tab">Academics</button>
    <button data-tab="buildings" role="tab">Buildings</button>
    <button data-tab="labs" role="tab">Labs &amp; Libraries</button>
  </div>
  <section id="academics"><div class="gallery"><figure><div class="ph">📚</div><figcaption>Classroom session 1</figcaption></figure><figure><div class="ph">📚</div><figcaption>Classroom session 2</figcaption></figure><figure><div class="ph">📚</div><figcaption>Classroom session 3</figcaption></figure><figure><div class="ph">📚</div><figcaption>Classroom session 4</figcaption></figure></div></section>
  <section id="buildings"><div class="gallery"><figure><div class="ph">🏫</div><figcaption>Campus building 1</figcaption></figure><figure><div class="ph">🏫</div><figcaption>Campus building 2</figcaption></figure><figure><div class="ph">🏫</div><figcaption>Campus building 3</figcaption></figure><figure><div class="ph">🏫</div><figcaption>Campus building 4</figcaption></figure></div></section>
  <section id="labs"><div class="gallery"><figure><div class="ph">🔬</div><figcaption>Nursing lab / library 1</figcaption></figure><figure><div class="ph">🔬</div><figcaption>Nursing lab / library 2</figcaption></figure><figure><div class="ph">🔬</div><figcaption>Nursing lab / library 3</figcaption></figure><figure><div class="ph">🔬</div><figcaption>Nursing lab / library 4</figcaption></figure></div></section>
  <p>To add photos, replace each <code>&lt;div class="ph"&gt;</code> with <code>&lt;img src="assets/img/your-photo.jpg" alt="..."&gt;</code>.</p>
</div></main>
<footer id="site-footer"></footer>
</body>
</html>
