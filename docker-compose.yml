# Local SQL Server 2022 for development and testing.
#   docker compose up -d
# Then set DB_PASSWORD in server/.env to the same password.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Dev_Passw0rd!"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sfm-sqldata:/var/opt/mssql
volumes:
  sfm-sqldata:
